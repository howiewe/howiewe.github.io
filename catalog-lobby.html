<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title 和 meta 會由 SSR 動態填入 -->
    <title>產品分類</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/lobby.css">
    <script src="/js/theme.js" defer></script>
</head>

<body>
    <!-- Header 區塊 -->
    <header>
        <div class="header-content">
            <h1><a href="/" style="text-decoration: none; color: inherit;">探索產品系列</a></h1>
            <div class="header-actions">
                <div class="theme-toggle-placeholder"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- 頂部導覽區塊 -->
            <div class="lobby-top-bar">
                <div class="breadcrumb-trail">
                    <a href="/">主頁</a> &gt; <span>探索產品系列</span>
                </div>
            </div>

            <!-- [新增] 精選分類區塊 -->
            <div id="featured-category-container"></div>

            <!-- 分類卡片將由 SSR 動態注入到這裡 -->
            <div id="category-grid-container" class="category-lobby-grid">
                <!-- SSR Pre-rendering Content -->
                <p class="empty-message">正在載入分類...</p>
            </div>
        </div>
    </main>

    <!-- 這裡不需要 script，因為它只是一個被渲染的模板 -->
</body>

</html>
